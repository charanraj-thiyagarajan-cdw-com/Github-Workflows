name: 04 - Scheduled Cron Trigger

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  nightly-job:
    name: Scheduled Maintenance / Nightly Scan
    runs-on: ubuntu-latest
    steps:
      - name: Execute Scheduled Task
        run: |
          echo "Scheduled event fired at: $(date -u)"
          echo "Event Name: ${{ github.event_name }}"
