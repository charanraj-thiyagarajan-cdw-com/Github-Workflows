name: 03 - Variables, Secrets, and GitHub Context

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  APP_ENV: staging

jobs:
  deploy:
    name: Variables, Secrets & Context Demo
    runs-on: ubuntu-latest

    steps:
      - name: Read Workflow Environment Variable
        run: echo "${{ env.APP_ENV }}"

      - name: Read GitHub Context
        run: echo "${{ github.ref_name }}"

      - name: Use Repository Secrets and Variables
        run: |
          echo "Log level from GitHub vars: $LEVEL"
          echo "Target environment: $APP_ENV"
          echo "API Key loaded securely from secrets (masked in logs): $API_KEY"
        env:
          API_KEY: ${{ secrets.API_KEY }}
          LEVEL: ${{ vars.LOG_LEVEL }}
          APP_ENV: ${{ env.APP_ENV }}
