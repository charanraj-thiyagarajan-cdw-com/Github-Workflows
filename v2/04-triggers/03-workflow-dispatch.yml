name: 04 - Manual Trigger (workflow_dispatch)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        default: "staging"
        options:
          - development
          - staging
          - production
      run_integration_tests:
        description: "Run comprehensive integration test suite"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Release tag identifier (optional)"
        required: false
        type: string
        default: "v1.0.0"

jobs:
  manual-run:
    name: Manual Workflow Execution
    runs-on: ubuntu-latest
    steps:
      - name: Process User Inputs
        run: |
          echo "Selected Environment:  ${{ inputs.environment }}"
          echo "Integration Tests:     ${{ inputs.run_integration_tests }}"
          echo "Release Tag:           ${{ inputs.release_tag }}"
          echo "Triggered By User:     ${{ github.actor }}"
